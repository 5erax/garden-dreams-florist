<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khôi phục tài khoản Garden Dreams</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f1e9;
      color: #243829;
      font-family: Arial, sans-serif;
      line-height: 1.7;
    "
  >
    <table
      role="presentation"
      style="
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        border-collapse: collapse;
      "
    >
      <tr>
        <td
          style="padding: 32px; background: #fffdf8; border: 1px solid #d9dfcf"
        >
          <p style="font-size: 14px; letter-spacing: 2px">GARDEN DREAMS</p>
          <h1
            style="
              font-size: 28px;
              font-family: Georgia, serif;
              font-weight: normal;
            "
          >
            Trở về góc của bạn.
          </h1>
          <p>
            Chúng tôi nhận được yêu cầu đổi mật khẩu. Mở link dưới đây để chọn
            mật khẩu mới cho tài khoản của bạn.
          </p>
          <p style="margin: 28px 0">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                padding: 12px 20px;
                background: #294d37;
                color: white;
                text-decoration: none;
                border-radius: 4px;
              "
              >Đặt mật khẩu mới</a
            >
          </p>
          <p style="font-size: 14px">
            Nếu bạn không yêu cầu đổi mật khẩu, hãy bỏ qua email. Không chia sẻ
            link khôi phục cho người khác.
          </p>
          <p
            style="
              font-size: 13px;
              border-top: 1px solid #d9dfcf;
              padding-top: 16px;
            "
          >
            Garden Dreams · Hoa mang lời thương.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
